name: Replace standing dead tree wording

on:
  push:
    branches:
      - vereenvoudig-dode-boom

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vereenvoudig-dode-boom
      - name: Replace wording and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/hoofdstukken/01-wat-verschijnt-verschijnt-onaf.md')
          s = p.read_text()
          s2 = s.replace('Steve Redman / U.S. National Park Service, staande dode boom,', 'Steve Redman / U.S. National Park Service, dode boom,')
          s2 = s2.replace('Een staande dode boom kan nog jaren herkenbaar overeind blijven nadat groei en herstel zijn gestopt.', 'Een dode boom kan nog jaren herkenbaar overeind blijven nadat groei en herstel zijn gestopt.')
          if s2 == s:
              raise SystemExit('Expected wording not found')
          p.write_text(s2)
          PY
          rm .github/workflows/replace-standing-dead-tree.yml
          git config user.name "HGRKzkzk"
          git config user.email "31103706+HGRKzkzk@users.noreply.github.com"
          git add src/pages/hoofdstukken/01-wat-verschijnt-verschijnt-onaf.md .github/workflows/replace-standing-dead-tree.yml
          git commit -m "Vereenvoudig dode-boom-uitkijkje"
          git push