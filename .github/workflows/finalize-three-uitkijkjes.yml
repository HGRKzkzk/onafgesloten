name: Finalize three uitkijkjes

on:
  push:
    branches: [voeg-drie-uitkijkjes-toe]
    paths:
      - .github/workflows/finalize-three-uitkijkjes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voeg-drie-uitkijkjes-toe

      - name: Normalize markdown spacing and register wording
        run: |
          python <<'PY'
          from pathlib import Path
          replacements = {
              'src/pages/hoofdstukken/10-taal-kennis-en-intelligentie.md': ('</aside>\nModelkwaliteit omvat daarom meer dan voorspellende nauwkeurigheid:', '</aside>\n\nModelkwaliteit omvat daarom meer dan voorspellende nauwkeurigheid:'),
              'src/pages/hoofdstukken/14-drie-toetsgevallen-wat-verandert-er-wanneer-dit-denken-iets-moet-doen.md': ('</aside>\n## Geval IV: wanneer het denken moet stoppen', '</aside>\n\n## Geval IV: wanneer het denken moet stoppen'),
              'src/pages/hoofdstukken/16-zelfbegrenzing-ook-dit-denken-blijft-onaf.md': ('</aside>\nWanneer hetzelfde begrip tegengestelde gevallen', '</aside>\n\nWanneer hetzelfde begrip tegengestelde gevallen'),
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text()
              assert old in s, f'Verwachte overgang ontbreekt in {filename}'
              p.write_text(s.replace(old, new, 1))
          reg = Path('UITKIJKJES_REGISTER.md')
          s = reg.read_text()
          assert 'Byzantijnse / Griekse manuscripttraditie; moderne imaging' in s
          reg.write_text(s.replace('Byzantijnse / Griekse manuscripttraditie; moderne imaging', 'Byzantijnse / Griekse manuscripttraditie; moderne beeldvorming', 1))
          PY

      - name: Rebuild and verify
        run: |
          set -euo pipefail
          npm ci
          npm run build 2>&1 | tee /tmp/build.log
          grep -F '19 page(s) built' /tmp/build.log
          ! grep -F '[Onafgesloten]' /tmp/build.log
          ! grep -rn 'src="/onafgesloten' src/pages/hoofdstukken/
          test "$(grep -Rho '<aside class="uitkijkje' src/pages/hoofdstukken | wc -l | tr -d ' ')" = "25"
          test -s public/images/hoofdstuk-10/mercator-wereldkaart-1569.jpg
          test -s public/images/hoofdstuk-14/galton-composietportretten.jpg
          test -s public/images/hoofdstuk-16/archimedes-palimpsest.jpg

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-three-uitkijkjes.yml
          git config user.name 'HGRKzkzk'
          git config user.email '31103706+HGRKzkzk@users.noreply.github.com'
          git add src/pages/hoofdstukken/10-taal-kennis-en-intelligentie.md \
                  src/pages/hoofdstukken/14-drie-toetsgevallen-wat-verandert-er-wanneer-dit-denken-iets-moet-doen.md \
                  src/pages/hoofdstukken/16-zelfbegrenzing-ook-dit-denken-blijft-onaf.md \
                  UITKIJKJES_REGISTER.md \
                  .github/workflows/finalize-three-uitkijkjes.yml
          git commit -m 'Rond opmaak en register van uitkijkjes af'
          git push origin HEAD:voeg-drie-uitkijkjes-toe
