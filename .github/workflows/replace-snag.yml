name: Replace snag wording

on:
  push:
    branches: [vertaal-snag-uitkijkje]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace wording and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/hoofdstukken/01-wat-verschijnt-verschijnt-onaf.md')
          s = p.read_text()
          old1 = 'Steve Redman / U.S. National Park Service, staande dode boom (<em>tree snag</em>),\n      Mount Rainier National Park, 2009. Publiek domein.'
          new1 = 'Steve Redman / U.S. National Park Service, staande dode boom,\n      Mount Rainier National Park, 2009. Publiek domein.'
          old2 = 'Een <em>snag</em> is een staande dode boom. Stam en takken kunnen nog jaren herkenbaar overeind blijven\n    nadat groei en herstel zijn gestopt.'
          new2 = 'Een staande dode boom kan nog jaren herkenbaar overeind blijven nadat groei en herstel zijn gestopt.'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected wording not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          Path('.github/workflows/replace-snag.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Vervang snag door gewoon Nederlands"
          git push
