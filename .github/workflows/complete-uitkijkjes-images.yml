name: Complete uitkijkjes images

on:
  push:
    branches:
      - lokaliseer-uitkijkjes-afbeeldingen

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lokaliseer-uitkijkjes-afbeeldingen
          fetch-depth: 0

      - name: Download remaining images and update asides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          root = Path('.')
          ua = {'User-Agent': 'Onafgesloten image vendor/1.0 (github.com/HGRKzkzk/onafgesloten)'}

          images = [
              {
                  'chapter': 'src/pages/hoofdstukken/06-draagroutes-ritme-en-herstel.md',
                  'title': 'Ook muziek bestaat uit niet-spelen',
                  'out': 'public/images/hoofdstuk-06/music-rests.svg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Music_rests.svg',
                  'src': '/onafgesloten/images/hoofdstuk-06/music-rests.svg',
                  'alt': 'Een reeks rusttekens uit de westerse muzieknotatie met verschillende tijdsduren.',
                  'caption': 'Rusttekens in westerse muzieknotatie. Wikimedia Commons, Music rests.svg. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Music_rests.svg" target="_blank" rel="noopener noreferrer">Wikimedia Commons — Music rests.svg, publiek domein</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/08-vrijheid-binnen-bepaaldheid-en-verschil-zonder-absoluut-dualisme.md',
                  'title': 'Een paar akkoorden zijn soms genoeg',
                  'out': 'public/images/hoofdstuk-08/miles-davis-gottlieb.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Miles_Davis%2C_Howard_McGhee%2C_September_1947_%28Gottlieb_05711%29.jpg?width=1400',
                  'src': '/onafgesloten/images/hoofdstuk-08/miles-davis-gottlieb.jpg',
                  'alt': 'Miles Davis en Howard McGhee tijdens een optreden in 1947, gefotografeerd door William P. Gottlieb.',
                  'caption': 'Miles Davis en Howard McGhee, 1947. Foto William P. Gottlieb / Library of Congress. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Miles_Davis%2C_Howard_McGhee%2C_September_1947_%28Gottlieb_05711%29.jpg" target="_blank" rel="noopener noreferrer">William P. Gottlieb / Library of Congress via Wikimedia Commons — publiek domein</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/09-liefde-klauwen-en-wederzijdse-bescherming.md',
                  'title': 'Nijntje hoeft niet groot te worden',
                  'out': 'public/images/hoofdstuk-09/nijntje-sculptuur.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sculptuur_%27Nijntje%27_door_Marc_Bruna%2C_Nijntjepleintje%2C_Utrecht.jpg?width=1400',
                  'src': '/onafgesloten/images/hoofdstuk-09/nijntje-sculptuur.jpg',
                  'alt': 'Het Nijntje-beeld van Marc Bruna op het Nijntjepleintje in Utrecht.',
                  'caption': 'Nijntje-sculptuur van Marc Bruna, Utrecht. Foto FakirNL, 2023, CC BY-SA 4.0.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Sculptuur_%27Nijntje%27_door_Marc_Bruna%2C_Nijntjepleintje%2C_Utrecht.jpg" target="_blank" rel="noopener noreferrer">FakirNL / Wikimedia Commons — CC BY-SA 4.0</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/09-liefde-klauwen-en-wederzijdse-bescherming.md',
                  'title': 'Stoelen, lichamen, bijna-botsingen',
                  'out': 'public/images/hoofdstuk-09/pina-bausch.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Recueil._Photographies._Portraits_de_Pina_Bausch._Festival_d%27Avignon._1981_-_btv1b10607955f_%2810_of_11%29.jpg?width=1400',
                  'src': '/onafgesloten/images/hoofdstuk-09/pina-bausch.jpg',
                  'alt': 'Pina Bausch tijdens het Festival van Avignon in 1981, gefotografeerd door Fernand Michaud.',
                  'caption': 'Pina Bausch, Festival van Avignon, 1981. Foto Fernand Michaud / Bibliothèque nationale de France. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Recueil._Photographies._Portraits_de_Pina_Bausch._Festival_d%27Avignon._1981_-_btv1b10607955f_%2810_of_11%29.jpg" target="_blank" rel="noopener noreferrer">Fernand Michaud / BnF via Wikimedia Commons — publiek domein</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/10-taal-kennis-en-intelligentie.md',
                  'title': 'Een toren van taal',
                  'out': 'public/images/hoofdstuk-10/bruegel-toren-van-babel.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_%28Vienna%29_-_Google_Art_Project_-_edited.jpg?width=1800',
                  'src': '/onafgesloten/images/hoofdstuk-10/bruegel-toren-van-babel.jpg',
                  'alt': 'Pieter Bruegel de Oude, De toren van Babel, met een enorme ronde bouwplaats vol arbeiders en steigers.',
                  'caption': 'Pieter Bruegel de Oude, De toren van Babel, 1563. Kunsthistorisches Museum Wien. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_%28Vienna%29_-_Google_Art_Project_-_edited.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons — reproductie en rechteninformatie</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/11-zin-dood-en-viering.md',
                  'title': 'Gilgamesj vindt geen achterdeur',
                  'out': 'public/images/hoofdstuk-11/gilgamesj-tablet.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Tablet_of_the_Gilgamish_Epic_%28Obverse%29.jpg?width=1200',
                  'src': '/onafgesloten/images/hoofdstuk-11/gilgamesj-tablet.jpg',
                  'alt': 'Voorzijde van een kleitablet met spijkerschrift uit het Gilgamesj-epos.',
                  'caption': 'Tablet van het Gilgamesj-epos, reproductie gepubliceerd door Stephen Langdon, 1917. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Tablet_of_the_Gilgamish_Epic_%28Obverse%29.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons / Stephen Langdon — publiek domein</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/13-velden-instituties-en-georganiseerde-sluiting.md',
                  'title': 'Bureaucratie heeft een lange komische geschiedenis',
                  'out': 'public/images/hoofdstuk-13/daumier-gens-de-justice.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Honor%C3%A9_Daumier_-_Les_gens_de_justice.jpg?width=1200',
                  'src': '/onafgesloten/images/hoofdstuk-13/daumier-gens-de-justice.jpg',
                  'alt': 'Honoré Daumier, een satirische lithografie uit de reeks Les Gens de Justice.',
                  'caption': 'Honoré Daumier, Les Gens de Justice, 19e eeuw. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Honor%C3%A9_Daumier_-_Les_gens_de_justice.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons — afbeelding en rechteninformatie</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/13-velden-instituties-en-georganiseerde-sluiting.md',
                  'title': 'Een lege hoek wordt een speelplaats',
                  'out': 'public/images/hoofdstuk-13/van-eyck-speeltoestel.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/PlaygroundAldovanEyck1962.jpg?width=1400',
                  'src': '/onafgesloten/images/hoofdstuk-13/van-eyck-speeltoestel.jpg',
                  'alt': 'Een iglovormig klimtoestel naar ontwerp van Aldo van Eyck in de beeldentuin van het Rijksmuseum.',
                  'caption': 'Speeltoestel naar ontwerp van Aldo van Eyck, oorspronkelijk ca. 1962. Foto Vysotsky, 2021, CC BY-SA 4.0.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:PlaygroundAldovanEyck1962.jpg" target="_blank" rel="noopener noreferrer">Vysotsky / Wikimedia Commons — CC BY-SA 4.0</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/14-drie-toetsgevallen-wat-verandert-er-wanneer-dit-denken-iets-moet-doen.md',
                  'title': 'De koe kijkt niet terug als beleidsmodel',
                  'out': 'public/images/hoofdstuk-14/potter-de-stier.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Paulus_Potter_-_The_Bull_-_136_-_Mauritshuis.jpg?width=1600',
                  'src': '/onafgesloten/images/hoofdstuk-14/potter-de-stier.jpg',
                  'alt': 'Paulus Potter, De Stier, een monumentaal rund in een landschap.',
                  'caption': 'Paulus Potter, De Stier, 1647. Mauritshuis. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Paulus_Potter_-_The_Bull_-_136_-_Mauritshuis.jpg" target="_blank" rel="noopener noreferrer">Mauritshuis via Wikimedia Commons — publiek domein</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/15-culturele-bescheidenheid-en-intellectuele-buren.md',
                  'title': 'Op de brug boven de Hao',
                  'out': 'public/images/hoofdstuk-15/zhou-pleasures-of-fishes.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Zhou_Dongqing_1291_Pleasure_of_fishes_DP212840_CRD.jpg?width=1600',
                  'src': '/onafgesloten/images/hoofdstuk-15/zhou-pleasures-of-fishes.jpg',
                  'alt': 'Zhou Dongqing, The Pleasures of Fishes, een Chinese handrol met vissen in water.',
                  'caption': 'Zhou Dongqing, The Pleasures of Fishes, 1291, Yuan-dynastie. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Zhou_Dongqing_1291_Pleasure_of_fishes_DP212840_CRD.jpg" target="_blank" rel="noopener noreferrer">The Metropolitan Museum of Art via Wikimedia Commons — publiek domein</a> · <a href="https://ctext.org/zhuangzi/floods-of-autumn" target="_blank" rel="noopener noreferrer">Chinese Text Project — Zhuangzi, “The Floods of Autumn”</a></p>',
              },
              {
                  'chapter': 'src/pages/hoofdstukken/16-zelfbegrenzing-ook-dit-denken-blijft-onaf.md',
                  'title': 'Een schilderij dat naar zijn eigen kijken kijkt',
                  'out': 'public/images/hoofdstuk-16/velazquez-las-meninas.jpg',
                  'url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Las_Meninas_by_Diego_Vel%C3%A1zquez.jpg?width=1600',
                  'src': '/onafgesloten/images/hoofdstuk-16/velazquez-las-meninas.jpg',
                  'alt': 'Diego Velázquez, Las Meninas, met de schilder zelf, hofpersonen, een spiegel en meerdere blikrichtingen.',
                  'caption': 'Diego Velázquez, Las Meninas, 1656. Museo del Prado. Publiek domein.',
                  'source': '<p class="uitkijkje__source"><a href="https://commons.wikimedia.org/wiki/File:Las_Meninas_by_Diego_Vel%C3%A1zquez.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons — reproductie en rechteninformatie</a></p>',
              },
          ]

          def download(url, dest):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = r.read()
              if len(data) < 1000:
                  raise RuntimeError(f'Download too small for {dest}: {len(data)} bytes')
              dest.write_bytes(data)

          for item in images:
              download(item['url'], item['out'])

          by_chapter = {}
          for item in images:
              by_chapter.setdefault(item['chapter'], []).append(item)

          for chapter, items in by_chapter.items():
              p = Path(chapter)
              text = p.read_text(encoding='utf-8')
              for item in items:
                  title = re.escape(item['title'])
                  pat = re.compile(r'(<aside class="uitkijkje[^>]*>.*?<h3 class="uitkijkje__title">' + title + r'</h3>)(.*?)(</aside>)', re.S)
                  m = pat.search(text)
                  if not m:
                      raise RuntimeError(f'Uitkijkje not found: {item["title"]} in {chapter}')
                  block = m.group(0)
                  if '<figure' in block or '<img' in block:
                      raise RuntimeError(f'Uitkijkje already visual unexpectedly: {item["title"]}')
                  figure = (
                      '\n<figure class="uitkijkje__figure">\n'
                      f'  <img src="{item["src"]}" alt="{item["alt"]}" loading="lazy" />\n'
                      f'  <figcaption>{item["caption"]}</figcaption>\n'
                      '</figure>'
                  )
                  block = block.replace(f'<h3 class="uitkijkje__title">{item["title"]}</h3>', f'<h3 class="uitkijkje__title">{item["title"]}</h3>{figure}', 1)
                  source_pat = re.compile(r'<p class="uitkijkje__source">.*?</p>', re.S)
                  if source_pat.search(block):
                      block = source_pat.sub(item['source'], block, count=1)
                  else:
                      block = block.replace('</aside>', item['source'] + '\n</aside>', 1)
                  text = text[:m.start()] + block + text[m.end():]
              p.write_text(text, encoding='utf-8')

          # Definition-of-done validation across the complete public chapter set.
          aside_re = re.compile(r'<aside class="uitkijkje[^>]*>.*?</aside>', re.S)
          img_re = re.compile(r'<img[^>]+src="([^"]+)"', re.S)
          all_blocks = []
          errors = []
          for p in sorted(Path('src/pages/hoofdstukken').glob('*.md')):
              text = p.read_text(encoding='utf-8')
              for block in aside_re.findall(text):
                  all_blocks.append((p, block))
                  title_m = re.search(r'<h3 class="uitkijkje__title">(.*?)</h3>', block, re.S)
                  title = title_m.group(1).strip() if title_m else '(zonder titel)'
                  if '<figure' not in block or '<img' not in block:
                      errors.append(f'{p.name}: {title}: geen figure/img')
                      continue
                  src_m = img_re.search(block)
                  if not src_m:
                      errors.append(f'{p.name}: {title}: geen img src')
                      continue
                  src = src_m.group(1)
                  if not src.startswith('/onafgesloten/images/'):
                      errors.append(f'{p.name}: {title}: niet-lokale src {src}')
                  local = Path('public') / src.removeprefix('/onafgesloten/')
                  if not local.exists() or local.stat().st_size < 1000:
                      errors.append(f'{p.name}: {title}: lokaal beeld ontbreekt/leeg: {local}')
                  if 'uitkijkje__source' not in block:
                      errors.append(f'{p.name}: {title}: bronregel ontbreekt')

          if len(all_blocks) != 22:
              errors.append(f'Verwacht 22 uitkijkjes, gevonden {len(all_blocks)}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(all_blocks)} visual uitkijkjes: all local, all sourced.')
          PY

          rm .github/workflows/complete-uitkijkjes-images.yml

      - name: Commit completed visual layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maak alle 22 uitkijkjes visueel en lokaal"
          git push origin HEAD:lokaliseer-uitkijkjes-afbeeldingen
